name: Card Map (UMAP + communities)

on:
  schedule:
    # Tous les 3 jours à 18:30 UTC — APRÈS la Trophy Map (18:00) afin que
    # synergy_scores + trophy_decks soient frais du jour.
    - cron: '30 18 */3 * *'
  # Déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build-card-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Card Map
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backend/etl_umap_cardmap.py
