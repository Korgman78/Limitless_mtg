name: 17Lands Cookie Health Check

on:
  schedule:
    # Tous les jours a 13:00 UTC, avant l'ETL trophy decks (15:46 UTC).
    # Failure declenche un mail automatique au proprietaire du repo.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Sentinel call to 17Lands API
        env:
          LANDS17_COOKIE: ${{ secrets.LANDS17_COOKIE }}
        run: python backend/check_lands17_cookie.py
