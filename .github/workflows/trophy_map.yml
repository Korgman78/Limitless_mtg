name: Trophy Map (UMAP)

on:
  schedule:
    # Tous les 3 jours à 18:00 UTC (jours 1,4,7,…,28,31 du mois).
    # 18:00 = APRÈS la "Daily Trophy Decks Pipeline" (15:46 UTC) afin que
    # trophy_decks + archetypal_skeletons soient frais du jour.
    - cron: '0 18 */3 * *'
  # Déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build-trophy-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Trophy Map
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backend/etl_umap_trophymap.py
