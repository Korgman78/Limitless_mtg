name: Diary Weekly Report

on:
  schedule:
    # Tous les lundis a 07:00 UTC : la semaine ecoulee est complete.
    - cron: '0 7 * * 1'
  # Permet de generer une semaine a la demande depuis l'onglet Actions.
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Lundi de la semaine a traiter (YYYY-MM-DD). Vide = semaine ecoulee.'
        required: false
        type: string

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Generate weekly diary report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/etl_diary_weekly.py ${{ inputs.week_start }}
